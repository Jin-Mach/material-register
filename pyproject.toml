[project]
name = "material-register"
version = "1.0.0"
description = "Material tracking desktop application built with PySide and SQLite"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

authors = [
    { name = "Jindřich Machytka" }
]

dependencies = [
    "PySide6",
    "requests",
    "tomli_w",
    "openpyxl",
    "reportlab"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["BLE001",
    "RUF012",
    "LOG014",
    "SIM117"
]

[tool.coverage.run]
source = ["material_register"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true