[project]
name = "material-register"
version = "1.0.0"
description = "Material tracking desktop application built with PySide and SQLite"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Jin-Mach" }
]

dependencies = [
    "PySide6",
    "requests",
    "tomli_w",
    "openpyxl"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py313"