[project]
name = "material-register"
version = "0.1.0"
description = "Material tracking desktop application built with PySide and SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Jin-Mach" }
]

dependencies = [
    "PySide6"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"